<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Change Password - শান্তিসংঘ (SHANTISONGHO)</title>
    <link rel="stylesheet" href="/frontend/styles/login-style.css" />
    <style>
      .password-requirements {
        background: var(--card-bg);
        border-radius: 8px;
        padding: 15px;
        margin-top: 15px;
        font-size: 0.9rem;
      }
      .password-requirements h4 {
        margin: 0 0 10px 0;
        color: var(--primary-color);
      }
      .password-requirements ul {
        margin: 0;
        padding-left: 20px;
      }
      .password-requirements li {
        margin: 5px 0;
        color: var(--text-secondary);
      }
      .requirement-met {
        color: #4caf50 !important;
      }
      .requirement-unmet {
        color: #f44336 !important;
      }
    </style>
  </head>
  <body>
    <!-- Navigation -->
    <nav class="navbar">
      <div class="nav-container">
        <div class="nav-logo" onclick="logoRefresh()">
          <div class="logo-icon">
            <img
              src="/frontend/logo/without_bg_logo.png"
              alt="nav-logo"
              class="nav-logo-img"
            />
          </div>
          <div class="logo-text">
            <h1>শান্তিসংঘ</h1>
            <p>SHANTISONGHO</p>
          </div>
        </div>

        <div class="nav-links">
          <div class="dark-mode-toggle">
            <span class="sun-icon">🌞</span>
            <button class="toggle-btn" onclick="toggleDarkMode()">
              <span class="toggle-slider"></span>
            </button>
            <span class="moon-icon">🌙</span>
          </div>
        </div>

        <!-- Mobile Menu Button -->
        <button class="mobile-menu-btn" onclick="toggleMobileMenu()">
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>

      <!-- Mobile Menu -->
      <div class="mobile-menu" id="mobileMenu">
        <div class="mobile-menu-content">
          <div class="mobile-dark-toggle">
            <span>🌞</span>
            <button class="mobile-toggle-btn" onclick="toggleDarkMode()">
              <span class="mobile-toggle-slider"></span>
            </button>
            <span>🌙</span>
          </div>
        </div>
      </div>
    </nav>

    <!-- Dynamic Background -->
    <div class="background-container">
      <div class="gradient-bg"></div>
      <div class="animated-patterns">
        <div class="floating-shape shape-1"></div>
        <div class="floating-shape shape-2"></div>
        <div class="floating-shape shape-3"></div>
        <div class="islamic-star star-1"></div>
      </div>
    </div>

    <!-- Main Content -->
    <main class="login-main">
      <div class="login-container">
        <div class="login-card">
          <div class="login-header">
            <div class="login-logo">
              <img
                src="/frontend/logo/without_bg_logo.png"
                alt="nav-logo"
                class="main-logo-img"
              />
            </div>
            <div class="login-title">
              <h1>Change Password</h1>
              <p>First Login - Please set a new password</p>
            </div>
          </div>

          <form class="login-form" id="changePasswordForm" onsubmit="handleChangePassword(event)">
            <!-- New Password Field -->
            <div class="form-group">
              <label for="newPassword">New Password</label>
              <div class="input-wrapper">
                <div class="input-icon">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                    <path d="M7 11V7a5 5 0 0110 0v4"/>
                  </svg>
                </div>
                <input
                  type="password"
                  id="newPassword"
                  name="newPassword"
                  placeholder="Enter new password"
                  required
                  oninput="validatePasswordStrength(this)"
                />
                <button type="button" class="toggle-password" onclick="togglePasswordVisibility('newPassword')">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                  </svg>
                </button>
              </div>
              <span class="error-message" id="newPasswordError"></span>
            </div>

            <!-- Confirm Password Field -->
            <div class="form-group">
              <label for="confirmPassword">Confirm Password</label>
              <div class="input-wrapper">
                <div class="input-icon">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                    <path d="M7 11V7a5 5 0 0110 0v4"/>
                  </svg>
                </div>
                <input
                  type="password"
                  id="confirmPassword"
                  name="confirmPassword"
                  placeholder="Confirm new password"
                  required
                  oninput="validatePasswordMatch()"
                />
                <button type="button" class="toggle-password" onclick="togglePasswordVisibility('confirmPassword')">
                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                  </svg>
                </button>
              </div>
              <span class="error-message" id="confirmPasswordError"></span>
            </div>

            <!-- Password Requirements -->
            <div class="password-requirements">
              <h4>Password Requirements:</h4>
              <ul id="passwordRequirements">
                <li id="req-length" class="requirement-unmet">At least 6 characters</li>
                <li id="req-uppercase" class="requirement-unmet">Contains uppercase letter</li>
                <li id="req-lowercase" class="requirement-unmet">Contains lowercase letter</li>
                <li id="req-number" class="requirement-unmet">Contains number</li>
                <li id="req-special" class="requirement-unmet">Contains special character (@, #, $, etc.)</li>
              </ul>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="login-btn" id="changePasswordBtn">
              <span class="btn-text">Change Password</span>
              <span class="btn-loading">
                <svg class="spinner" viewBox="0 0 50 50">
                  <circle class="path" cx="25" cy="25" r="20" fill="none" stroke-width="5"></circle>
                </svg>
                Processing...
              </span>
            </button>
          </form>

          <!-- Alert Box -->
          <div class="alert-box" id="alertBox">
            <div class="alert-content">
              <span class="alert-icon">ℹ️</span>
              <span class="alert-text" id="alertText"></span>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="/frontend/js/change-password.js"></script>
  </body>
</html>
